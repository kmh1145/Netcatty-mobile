name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          APP_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          APP_VERSION="${APP_VERSION%%+*}"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid pubspec version: $APP_VERSION" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Restore persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Persistent Android signing secrets are not configured" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/netcatty-release.jks
      - name: Build Android release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/netcatty-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: netcatty
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=GITHUB_OAUTH_CLIENT_ID=Ov23lidR2u8OIkHW19nk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/netcatty-mobile-v${{ steps.app_version.outputs.version }}-android.apk"
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --dart-define=GITHUB_OAUTH_CLIENT_ID=Ov23lidR2u8OIkHW19nk
      - name: Prepare Android package
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/netcatty-mobile-v${VERSION}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/netcatty-mobile-v${VERSION}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "dist/netcatty-mobile-v${VERSION}-android-x86_64.apk"
          cd dist
          for PACKAGE in *.apk; do
            sha256sum "$PACKAGE" > "$PACKAGE.sha256"
          done
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: netcatty-mobile-v${{ steps.app_version.outputs.version }}-android-apks-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          APP_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          APP_VERSION="${APP_VERSION%%+*}"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid pubspec version: $APP_VERSION" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS release app
        run: flutter build ios --release --no-codesign --dart-define=GITHUB_OAUTH_CLIENT_ID=Ov23lidR2u8OIkHW19nk
      - name: Package re-signable IPA
        shell: bash
        run: |
          PACKAGE="netcatty-mobile-v${{ steps.app_version.outputs.version }}-ios-unsigned.ipa"
          mkdir -p dist build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Payload "../../../dist/$PACKAGE"
          cd ../../../dist
          shasum -a 256 "$PACKAGE" > "$PACKAGE.sha256"
      - name: Upload re-signable IPA
        uses: actions/upload-artifact@v4
        with:
          name: netcatty-mobile-v${{ steps.app_version.outputs.version }}-ios-unsigned-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
